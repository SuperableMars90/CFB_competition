# Copy to secrets/wordpress.toml and fill in real values.
# Only needed if you're using the commissioner scripts that push
# rosters/records/recap pages to a WordPress site.
# DO NOT commit secrets/wordpress.toml to git.

[wordpress_creds]
url = "https://yoursite.example.com"
username = "your_wp_username"
password = "your_wp_application_password"   # a WordPress Application Password, not your login password
