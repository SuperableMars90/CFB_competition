# Copy to .streamlit/secrets.toml and fill in real values.
# This is what the Streamlit app itself reads (lib/db.py, lib/auth.py) --
# separate from secrets/*.toml, which is what the CLI scripts under
# scripts/ read instead, since they run outside a Streamlit context.
# DO NOT commit .streamlit/secrets.toml to git.

[aiven_mysql]
host = "your-project.aivencloud.com"
port = 12345
user = "avnadmin"
password = "your_db_password_here"
database = "defaultdb"
ssl_ca_path = "secrets/ca.pem"

# The CA cert CONTENT (not just the path) -- paste the entire ca.pem
# contents here as a multi-line string. Needed here in addition to
# ssl_ca_path above because mysql-connector-python needs a real file
# path, but Streamlit Cloud's secrets UI has no filesystem to put one
# on -- lib/db.py materializes this content into a temp file at runtime.
ssl_ca = """
-- paste the full contents of your ca.pem here --
"""

[auth]
# One line per player: the *exact-case* username matching that
# player's `players.username` column, mapped to their login password.
# Login is currently case-sensitive -- see PROGRESS.md.
alice = "somepassword"
bob = "anotherpassword"
